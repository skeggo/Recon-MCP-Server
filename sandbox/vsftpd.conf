listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
connect_from_port_20=YES

# Chroot local users to their home (and allow write)
chroot_local_user=YES
allow_writeable_chroot=YES

# Required secure empty dir
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Passive mode (publish these ports in compose)
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009

# Quality-of-life
force_dot_files=YES